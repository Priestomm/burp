name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The committed dataset and generated types must match the pipeline output.
      - run: uv run python build.py
      - run: uv run python export_schema.py
      - name: Check generated files are up to date
        run: git diff --exit-code -- ../app/static/data schema

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter app check
      - run: pnpm --filter worker check
      - run: pnpm test
      - name: Check generated types are up to date
        run: pnpm --filter app generate-types && git diff --exit-code -- app/src/lib/types
      - run: pnpm build

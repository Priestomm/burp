[project]
name = "burp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
]

[project.scripts]
burp = "burp.cli:main"

[project.optional-dependencies]
media = ["yt-dlp>=2025.1.1", "faster-whisper>=1.1.0", "av>=14.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
